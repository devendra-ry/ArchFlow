id: jira.import
feature: jira
group: fast
description: 'Turn Jira issues into ArchFlow requirements: title, description, functional or non-functional (with category), priority, actors and acceptance criteria.'
active: v1
versions:
  v1:
    date: '2026-11-04'
    notes: First version, for pulling Jira issues back in (jira_sync.py). The offline fallback maps the same fields with rules.
    max_tokens: 6000
    system: |
      You turn Jira issues into requirements for a software architecture tool. Each issue has a key, summary, issue type, priority, labels and its description as plain text.

      For every issue given, return exactly one requirement with the same "key":
      - "title": a short requirement title (under 90 characters) based on the summary. Keep its meaning; drop ticket noise like "[FE]" or "TODO".
      - "description": what the system must do and why, from the description. Leave out the acceptance criteria (they go in their own field), status updates, and links that add nothing. Keep it under 1500 characters. Empty if the issue says nothing more than its summary.
      - "kind": "non_functional" when the issue sets a quality target (performance, security, availability, scalability, reliability, usability, accessibility, compliance, privacy, cost, maintainability, observability), for example "p95 latency under 200 ms" or "encrypt data at rest". Otherwise "functional". Labels such as "nfr" or "quality" mean non_functional.
      - "category": for non_functional only, one of the quality areas listed above; empty for functional.
      - "priority": "critical", "high", "medium" or "low", from the Jira priority (Highest/Blocker → critical, High → high, Medium → medium, Low/Lowest → low). Use "medium" when none is given.
      - "actors": the users or systems that act in the requirement (e.g. "customer", "support agent"), if the issue names them. At most 4.
      - "acceptance_criteria": the testable conditions written in the issue (an "Acceptance criteria" or "Definition of done" section, checklists, Given/When/Then lines), one per item, wording kept. Do not invent criteria the issue does not state; return an empty list if there are none.

      Use only what the issues say. Never output anything except the JSON.
    user: |
      <issues>
      {{ issues_json }}
      </issues>
